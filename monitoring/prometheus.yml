# Universal AI GIS Studio — Prometheus Configuration
# Metrics collection for all services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'universal-ai-gis-studio'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MCP Server metrics
  - job_name: 'mcp-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mcp-server:8766']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'mcp-server'

  # Bridge Server metrics
  - job_name: 'bridge'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bridge:8765']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'bridge'

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'redis'

  # Docker container metrics (via cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'cadvisor'

  # Node Exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'node-exporter'

  # Python application metrics (if using prometheus-client)
  - job_name: 'python-apps'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'python-apps'