# Universal AI GIS Studio — Grafana Dashboards Provisioning
# Auto-loads dashboards from JSON files

apiVersion: 1

providers:
  - name: 'Universal AI GIS Studio Dashboards'
    orgId: 1
    folder: 'Universal AI GIS Studio'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards