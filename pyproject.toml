[project]
name = "universal-ai-gis-studio"
version = "1.0.0"
description = "Universal AI GIS Studio — MCP-first AI-controlled QGIS automation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Universal AI GIS Studio" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["GIS", "QGIS", "MCP", "AI", "automation", "geospatial"]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "anyio>=4.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "keyring>=24.0.0",
    "cryptography>=41.0.0",
    "python-dateutil>=2.8.0",
    "jmespath>=1.0.0",
    "typing-extensions>=4.8.0",
    "simpleeval>=0.9.14",
    "jsonschema>=4.20.0",
    "referencing>=0.30.0",
    "prometheus-client>=0.19.0",
    "pybreaker>=0.8.1",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0",
    "uvicorn[standard]>=0.25.0",
    "fastapi>=0.104.0",
    "starlette>=0.27.0",
    "jsonschema>=4.20.0",
    "referencing>=0.30.0",
    "prometheus-client>=0.19.0",
    "pybreaker>=0.8.1",
    "tenacity>=8.2.0",
]
opencv = [
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "imagehash>=4.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.0.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.90.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "ipython>=8.15.0",
    "ipdb>=0.13.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
keyring = [
    "keyring>=24.0.0",
    "secretstorage>=3.3.0",
]
redis = [
    "redis>=5.0.0",
]
all = [
    "mcp>=1.2.0",
    "uvicorn[standard]>=0.25.0",
    "fastapi>=0.104.0",
    "starlette>=0.27.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "imagehash>=4.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "keyring>=24.0.0",
    "secretstorage>=3.3.0",
    "redis>=5.0.0",
    "jsonschema>=4.20.0",
    "referencing>=0.30.0",
    "prometheus-client>=0.19.0",
    "pybreaker>=0.8.1",
    "tenacity>=8.2.0",
]

[project.entry-points]
console_scripts = [
    "uagis-mcp = mcp_server.main:main",
    "uagis-bridge = bridge.bridge_server_async:main",
    "uagis-build = scripts.build_release:main",
    "uagis-icons = scripts.generate_icons:main",
    "uagis-test-data = scripts.generate_test_data:main",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "core*",
    "bridge*",
    "engines*",
    "mcp_server*",
    "integrations*",
    "agents*",
    "skills*",
    "clusters*",
    "database*",
    "security*",
    "monitoring*",
    "utils*",
    "plugin*",
    "workflows*",
    "extensions*",
    "clusters*",
    "scripts*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.html", "*.md", "*.sql", "*.ico", "*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
]
per-file-ignores = {
    "tests/*": ["S101", "T201"],  # allow assert and print in tests
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
]
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring QGIS",
    "slow: Slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.venv/*",
    "*/.env/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit-hooks]
repos = [
    {repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.1.0", hooks = [
        {id = "ruff", args = ["--fix"]},
        {id = "ruff-format"},
    ]},
    {repo = "https://github.com/psf/black", rev = "23.12.0", hooks = [
        {id = "black"},
    ]},
    {repo = "https://github.com/pycqa/isort", rev = "5.13.0", hooks = [
        {id = "isort"},
    ]},
    {repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.5.0", hooks = [
        {id = "trailing-whitespace"},
        {id = "end-of-file-fixer"},
        {id = "check-yaml"},
        {id = "check-json"},
        {id = "check-toml"},
        {id = "check-merge-conflict"},
    ]},
]

[tool.setuptools.dynamic]
version = {attr = "universal_ai_gis_studio.__version__"}