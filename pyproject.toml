[project]
name = "universal-ai-gis-studio"
version = "1.0.0"
description = "Universal AI GIS Studio — MCP-first AI-controlled QGIS automation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Universal AI GIS Studio" }]
license = { text = "MIT" }

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
pydantic = ["pydantic>=2.5.0"]
opencv = ["opencv-python-headless>=4.8.0"]
keyring = ["keyring>=24.0.0"]
pytest = ["pytest>=7.0.0", "pytest-qt>=4.0.0"]
aiohttp = ["aiohttp>=3.9.0"]
httpx = ["httpx>=0.27.0"]
prometheus = ["prometheus-client>=0.19.0"]
pybreaker = ["pybreaker>=0.8.1"]
simpleeval = ["simpleeval>=0.9.14"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "bridge*", "engines*", "mcp_server*", "integrations*", "agents*", "skills*", "clusters*", "database*", "security*", "monitoring*", "utils*", "plugin*"]
