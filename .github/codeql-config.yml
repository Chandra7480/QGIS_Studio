# CodeQL Configuration for Universal AI GIS Studio
# Extends default queries with security-focused packs

name: "Universal AI GIS Studio CodeQL Config"

# Use default queries plus security-extended and security-and-quality
queries:
  - uses: security-extended
  - uses: security-and-quality

# Paths to ignore during analysis
paths-ignore:
  - tests/
  - scripts/
  - build/
  - dist/
  - .github/
  - docs/
  - "**/__pycache__/**"
  - "**/*.pyc"

# Custom query packs (if any)
# packs:
#   - my-org/my-custom-queries@main