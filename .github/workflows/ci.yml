name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday 02:00 UTC

env:
  PYTHON_VERSION: "3.11"
  QGIS_VERSION: "3.34"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  # ============================================================
  # 1. LINT & TYPE CHECK (fast, runs first on all PRs)
  # ============================================================
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e ".[pytest]"
          pip install ruff mypy pytest-cov

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy type check
        run: mypy --strict core bridge engines mcp_server clusters --ignore-missing-imports

  # ============================================================
  # 2. UNIT TESTS (no QGIS required, runs on Ubuntu)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e ".[pytest]"
          pip install pytest-asyncio hypothesis jsonschema imagehash pillow

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short -x \
            --junitxml=reports/unit-tests.xml \
            --cov=core --cov=bridge --cov=engines --cov=mcp_server --cov=clusters \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: reports/
          retention-days: 7

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./reports/coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # 3. CONTRACT TESTS (schema validation, runs on Ubuntu)
  # ============================================================
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e ".[pytest]"
          pip install jsonschema hypothesis pytest-snapshot

      - name: Run contract tests
        run: |
          pytest tests/contract -v --tb=short \
            --junitxml=reports/contract-tests.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-reports
          path: reports/
          retention-days: 7

  # ============================================================
  # 4. INTEGRATION TESTS (requires QGIS, runs on Windows)
  # ============================================================
  integration-tests:
    name: Integration Tests (QGIS)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [lint-and-type, unit-tests, contract-tests]
    if: runner.os == 'Windows'
    env:
      QGIS_PREFIX_PATH: "C:/Program Files/QGIS 3.34"
      PATH: "C:/Program Files/QGIS 3.34/bin;C:/Program Files/QGIS 3.34/apps/Python39;${{ env.PATH }}"
      PYTHONPATH: "C:/Program Files/QGIS 3.34/apps/qgis/python;C:/Program Files/QGIS 3.34/apps/Python39/Lib/site-packages"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QGIS LTR
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: qgis
          version: 3.34

      - name: Install QGIS via Chocolatey (fallback)
        if: runner.os == 'Windows'
        run: |
          choco install qgis-ltr --version=3.34.0 -y --no-progress
          # Verify installation
          "C:/Program Files/QGIS 3.34/bin/qgis-bin.exe" --version

      - name: Set up Python (use QGIS Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e ".[pytest]"
          pip install pytest-qt hypothesis jsonschema imagehash pillow pytest-snapshot

      - name: Generate test data
        run: |
          python scripts/generate_test_data.py --output-dir tests/fixtures/data

      - name: Start QGIS Bridge (background)
        run: |
          # Start QGIS with bridge plugin in headless mode
          # Note: In CI we use the bridge server directly
          python -m bridge.server --host 127.0.0.1 --port 8766 &
          sleep 15
          # Verify bridge is up
          curl -f http://127.0.0.1:8766/health || (echo "Bridge failed to start" && exit 1)

      - name: Run integration tests
        run: |
          pytest tests/integration -v --tb=short -k "not visual" \
            --junitxml=reports/integration-tests.xml

      - name: Run visual regression tests
        run: |
          pytest tests/visual -v --tb=short \
            --junitxml=reports/visual-tests.xml
        env:
          UPDATE_BASELINES: "0"

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: reports/
          retention-days: 7

      - name: Upload visual diffs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: tests/visual_diffs/
          retention-days: 14

  # ============================================================
  # 5. PROPERTY-BASED TESTS (Hypothesis fuzzing)
  # ============================================================
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-type, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e ".[pytest]"
          pip install hypothesis

      - name: Run property tests
        run: |
          pytest tests/property -v --tb=short --hypothesis-show-statistics \
            --junitxml=reports/property-tests.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-test-reports
          path: reports/
          retention-days: 7

  # ============================================================
  # 6. ERROR INJECTION TESTS
  # ============================================================
  error-injection-tests:
    name: Error Injection Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-type, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e ".[pytest]"
          pip install pytest-mock

      - name: Run error injection tests
        run: |
          pytest tests/error_injection -v --tb=short \
            --junitxml=reports/error-injection-tests.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: error-injection-test-reports
          path: reports/
          retention-days: 7

  # ============================================================
  # 7. LOAD TESTS (scheduled only)
  # ============================================================
  load-tests:
    name: Load & Stress Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [lint-and-type, unit-tests, integration-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e ".[pytest]"
          pip install aiohttp pytest-asyncio

      - name: Start bridge server
        run: |
          python -m bridge.server --host 127.0.0.1 --port 8766 &
          sleep 10
          curl -f http://127.0.0.1:8766/health

      - name: Run load tests
        run: |
          pytest tests/load -v --tb=short \
            --junitxml=reports/load-tests.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-reports
          path: reports/
          retention-days: 7

  # ============================================================
  # 8. BUILD & PACKAGE (after all tests pass)
  # ============================================================
  build-package:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-type, unit-tests, contract-tests, integration-tests, property-tests, error-injection-tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            pyproject.toml

      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # ============================================================
  # 9. NOTIFY ON FAILURE (optional)
  # ============================================================
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [lint-and-type, unit-tests, contract-tests, integration-tests, property-tests, error-injection-tests]
    if: failure()
    timeout-minutes: 5
    steps:
      - name: Send failure notification
        run: |
          echo "CI pipeline failed. Check GitHub Actions for details."
          # Could integrate with Slack, Discord, Email here

# ============================================================
# Concurrency control - cancel in-progress runs on new push
# ============================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true