name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  # ============================================================
  # 1. RUN TESTS (prerequisite for release)
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e ".[pytest]"
          pip install pytest-asyncio hypothesis jsonschema imagehash pillow

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short \
            --junitxml=reports/unit-tests.xml

      - name: Run contract tests
        run: |
          pytest tests/contract -v --tb=short \
            --junitxml=reports/contract-tests.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 7

  # ============================================================
  # 2. BUILD PACKAGE
  # ============================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            pyproject.toml

      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Generate SHA256 checksums
        run: |
          cd dist
          for file in *; do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256"
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/*.sha256
          retention-days: 30

      - name: Save version for release job
        run: |
          echo "VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_ENV
          echo "TAG=${{ steps.version.outputs.tag }}" >> $GITHUB_ENV

  # ============================================================
  # 3. CREATE GITHUB RELEASE
  # ============================================================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist/

      - name: Generate release notes
        id: release_notes
        run: |
          TAG=${{ env.TAG }}
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%an)" $PREV_TAG..$TAG --reverse)
          else
            NOTES=$(git log --pretty=format:"- %s (%an)" $TAG --reverse)
          fi
          
          # Escape for JSON
          NOTES_ESCAPED=$(echo "$NOTES" | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          echo "notes=$NOTES_ESCAPED" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: |
            ## Universal AI GIS Studio ${{ env.VERSION }}
            
            ${{ steps.release_notes.outputs.notes }}
            
            ### Assets
            - `universal_ai_gis_studio-${{ env.VERSION }}-py3-none-any.whl` — Python wheel
            - `universal_ai_gis_studio-${{ env.VERSION }}.tar.gz` — Source distribution
            - SHA256 checksums included
            
            ### Installation
            ```bash
            pip install universal_ai_gis_studio==${{ env.VERSION }}
            ```
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(env.TAG, 'rc') || contains(env.TAG, 'alpha') || contains(env.TAG, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 4. PUBLISH TO PYPI (Trusted Publishing / OIDC)
  # ============================================================
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Use trusted publishing (OIDC) - no password/token needed
          # Requires PyPI project configured with GitHub as trusted publisher
          print-hash: true
          attestations: true

  # ============================================================
  # 5. BUILD QGIS PLUGIN PACKAGE
  # ============================================================
  build-plugin:
    name: Build QGIS Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create plugin ZIP
        run: |
          cd plugin
          PLUGIN_NAME="universal_ai_gis"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${PLUGIN_NAME}-${VERSION}.zip"
          
          # Create clean plugin directory
          rm -rf build_plugin
          mkdir -p build_plugin/${PLUGIN_NAME}
          
          # Copy plugin files (exclude __pycache__, .pyc, tests, etc.)
          rsync -av \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='.pytest_cache' \
            --exclude='.git' \
            --exclude='tests' \
            --exclude='*.md' \
            --exclude='analysis_output.md' \
            universal_ai_gis/ build_plugin/${PLUGIN_NAME}/
          
          # Verify required files exist
          if [ ! -f "build_plugin/${PLUGIN_NAME}/__init__.py" ]; then
            echo "ERROR: __init__.py missing"
            exit 1
          fi
          if [ ! -f "build_plugin/${PLUGIN_NAME}/metadata.txt" ]; then
            echo "ERROR: metadata.txt missing"
            exit 1
          fi
          if [ ! -f "build_plugin/${PLUGIN_NAME}/resources/icon.png" ]; then
            echo "ERROR: icon.png missing"
            exit 1
          fi
          
          # Create ZIP
          cd build_plugin
          zip -r "../${ZIP_NAME}" ${PLUGIN_NAME}
          cd ..
          
          # Generate SHA256
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          cat "${ZIP_NAME}.sha256"
          
          echo "plugin_zip=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: qgis-plugin
          path: plugin/*.zip
          retention-days: 30

      - name: Upload plugin checksum
        uses: actions/upload-artifact@v4
        with:
          name: qgis-plugin-checksum
          path: plugin/*.sha256
          retention-days: 30

  # ============================================================
  # 6. ATTACH PLUGIN TO GITHUB RELEASE
  # ============================================================
  attach-plugin:
    name: Attach Plugin to Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [github-release, build-plugin]
    steps:
      - name: Download plugin package
        uses: actions/download-artifact@v4
        with:
          name: qgis-plugin
          path: plugin-dist/

      - name: Download plugin checksum
        uses: actions/download-artifact@v4
        with:
          name: qgis-plugin-checksum
          path: plugin-dist/

      - name: Attach plugin to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            plugin-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============================================================
# Concurrency control
# ============================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true