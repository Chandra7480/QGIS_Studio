[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uagis-mcp"
version = "1.0.0"
description = "Universal AI GIS Studio MCP Server — Connect QGIS to AI agents via Model Context Protocol"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Universal AI GIS Studio", email = "universal-ai-gis@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "httpx>=0.25.0",
    "pydantic>=2.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/uagis-mcp"
Repository = "https://github.com/your-org/uagis-mcp"
Issues = "https://github.com/your-org/uagis-mcp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["uagis_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true